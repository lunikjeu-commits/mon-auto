name: Build APK Mon auto
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le projet Android
        run: |
          flutter create --org com.lunikapp --project-name mon_auto --platforms android tmp_app
          rm -rf android
          cp -r tmp_app/android android
          rm -rf tmp_app
          sed -i 's/android:label="[^"]*"/android:label="Mon auto"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mon-auto-apk
          path: build/app/outputs/flutter-apk/app-release.apk
